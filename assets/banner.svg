<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#081418"/>
      <stop offset="1" stop-color="#0F2C33"/>
    </linearGradient>
    <radialGradient id="glowRed" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#E7352C" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#E7352C" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowTeal" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#00979D" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#00979D" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>

  <!-- PCB via dots -->
  <g fill="#1B4048">
    <circle cx="30" cy="30" r="2.5"/><circle cx="70" cy="30" r="2.5"/><circle cx="30" cy="70" r="2.5"/>
    <circle cx="1170" cy="30" r="2.5"/><circle cx="1130" cy="30" r="2.5"/><circle cx="1170" cy="70" r="2.5"/>
    <circle cx="30" cy="270" r="2.5"/><circle cx="70" cy="270" r="2.5"/><circle cx="30" cy="230" r="2.5"/>
    <circle cx="1170" cy="270" r="2.5"/><circle cx="1130" cy="270" r="2.5"/><circle cx="1170" cy="230" r="2.5"/>
  </g>

  <!-- circuit trace backbone connecting the icon cluster -->
  <g fill="none" stroke="#1F5C63" stroke-width="2">
    <path d="M180,150 L235,150 L235,110 L300,110"/>
    <path d="M180,150 L235,150 L235,190 L300,190"/>
    <path d="M380,150 L430,150"/>
    <path d="M510,150 L560,150 L560,105 L640,105"/>
    <path d="M510,150 L560,150 L560,195 L640,195"/>
    <path d="M700,150 L745,150"/>
  </g>
  <g fill="none" stroke="#00979D" stroke-width="2" opacity="0.55">
    <path d="M100,40 L100,90 L180,90"/>
    <path d="M100,260 L100,210 L180,210"/>
    <path d="M900,40 L900,80"/>
    <path d="M900,260 L900,220"/>
  </g>
  <g fill="#00979D">
    <circle cx="235" cy="110" r="3"/><circle cx="235" cy="190" r="3"/>
    <circle cx="560" cy="105" r="3"/><circle cx="560" cy="195" r="3"/>
    <circle cx="100" cy="90" r="3"/><circle cx="100" cy="210" r="3"/>
  </g>

  <!-- ================= ROBOT (hero) ================= -->
  <g transform="translate(60,68)">
    <circle cx="60" cy="60" r="72" fill="url(#glowTeal)"/>
    <!-- antenna -->
    <line x1="60" y1="4" x2="60" y2="-14" stroke="#5FA8AD" stroke-width="3" stroke-linecap="round"/>
    <circle cx="60" cy="-18" r="5" fill="#E7352C"/>
    <!-- head -->
    <rect x="14" y="6" width="92" height="82" rx="16" fill="#12333A" stroke="#3D7B82" stroke-width="2.5"/>
    <!-- side ears -->
    <rect x="2" y="34" width="10" height="24" rx="3" fill="#3D7B82"/>
    <rect x="108" y="34" width="10" height="24" rx="3" fill="#3D7B82"/>
    <!-- eyes -->
    <rect x="32" y="34" width="20" height="20" rx="5" fill="#E7352C"/>
    <rect x="68" y="34" width="20" height="20" rx="5" fill="#E7352C"/>
    <!-- mouth: equalizer bars -->
    <g fill="#7FE3E8">
      <rect x="34" y="68" width="6" height="10"/>
      <rect x="44" y="62" width="6" height="16"/>
      <rect x="54" y="66" width="6" height="12"/>
      <rect x="64" y="60" width="6" height="18"/>
      <rect x="74" y="66" width="6" height="12"/>
      <rect x="84" y="70" width="6" height="8"/>
    </g>
    <!-- neck -->
    <rect x="48" y="88" width="24" height="10" fill="#3D7B82"/>
  </g>

  <!-- ================= ULTRASONIC SENSOR ================= -->
  <g transform="translate(300,150)">
    <rect x="-30" y="-16" width="60" height="32" rx="6" fill="#12333A" stroke="#3D7B82" stroke-width="2"/>
    <circle cx="-12" cy="0" r="9" fill="#0A2226" stroke="#5FA8AD" stroke-width="2"/>
    <circle cx="12" cy="0" r="9" fill="#0A2226" stroke="#5FA8AD" stroke-width="2"/>
    <path d="M40,-22 A34,34 0 0 1 40,22" fill="none" stroke="#00979D" stroke-width="2.5" opacity="0.85"/>
    <path d="M52,-32 A48,48 0 0 1 52,32" fill="none" stroke="#00979D" stroke-width="2.5" opacity="0.5"/>
    <path d="M64,-42 A62,62 0 0 1 64,42" fill="none" stroke="#00979D" stroke-width="2.5" opacity="0.25"/>
  </g>

  <!-- ================= LCD / OLED DISPLAY ================= -->
  <g transform="translate(430,150)">
    <rect x="-40" y="-24" width="80" height="48" rx="5" fill="#12333A" stroke="#3D7B82" stroke-width="2"/>
    <rect x="-32" y="-16" width="64" height="32" rx="2" fill="#0A2226" stroke="#1F5C63" stroke-width="1.5"/>
    <g stroke="#7FE3E8" stroke-width="2.5" stroke-linecap="round">
      <line x1="-24" y1="-6" x2="-4" y2="-6"/>
      <line x1="-24" y1="4" x2="16" y2="4"/>
      <line x1="-24" y1="12" x2="0" y2="12"/>
    </g>
  </g>

  <!-- ================= WIFI / BLUETOOTH ================= -->
  <g transform="translate(560,150)">
    <circle r="42" fill="url(#glowRed)" opacity="0.25"/>
    <path d="M-24,4 A34,34 0 0 1 24,4" fill="none" stroke="#E7352C" stroke-width="3" stroke-linecap="round" opacity="0.9"/>
    <path d="M-14,14 A20,20 0 0 1 14,14" fill="none" stroke="#E7352C" stroke-width="3" stroke-linecap="round"/>
    <circle cx="0" cy="22" r="4" fill="#E7352C"/>
    <g transform="translate(38,0)" stroke="#00979D" stroke-width="2.5" stroke-linecap="round" fill="none">
      <path d="M0,-16 L0,16 L11,7 L-6,-4 L11,-7 L0,16"/>
    </g>
  </g>

  <!-- ================= MCU / CHIP ================= -->
  <g transform="translate(700,150)">
    <rect x="-26" y="-26" width="52" height="52" rx="4" fill="#12333A" stroke="#D9A94E" stroke-width="2"/>
    <rect x="-14" y="-14" width="28" height="28" fill="#0A2226" stroke="#5FA8AD" stroke-width="1.5"/>
    <g stroke="#D9A94E" stroke-width="2">
      <line x1="-34" y1="-16" x2="-26" y2="-16"/>
      <line x1="-34" y1="0" x2="-26" y2="0"/>
      <line x1="-34" y1="16" x2="-26" y2="16"/>
      <line x1="34" y1="-16" x2="26" y2="-16"/>
      <line x1="34" y1="0" x2="26" y2="0"/>
      <line x1="34" y1="16" x2="26" y2="16"/>
      <line x1="-16" y1="-34" x2="-16" y2="-26"/>
      <line x1="0" y1="-34" x2="0" y2="-26"/>
      <line x1="16" y1="-34" x2="16" y2="-26"/>
      <line x1="-16" y1="34" x2="-16" y2="26"/>
      <line x1="0" y1="34" x2="0" y2="26"/>
      <line x1="16" y1="34" x2="16" y2="26"/>
    </g>
  </g>

  <!-- ================= TITLE PANEL ================= -->
  <g transform="translate(790,0)">
    <line x1="0" y1="46" x2="0" y2="254" stroke="#1F5C63" stroke-width="2"/>
    <text x="34" y="118" font-family="'Courier New', Consolas, monospace" font-size="15" letter-spacing="3" fill="#5FA8AD">KREI LABS // PORTFOLIO</text>
    <text x="34" y="160" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#EAF6F6">Arduino &amp; ESP32</text>
    <text x="34" y="196" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#EAF6F6">Embedded Projects</text>
    <text x="34" y="228" font-family="'Courier New', Consolas, monospace" font-size="14" fill="#7FB3B8">Sensors · Displays · Robotics · Wireless Control</text>
  </g>
</svg>
